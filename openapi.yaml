openapi: 3.0.3
info:
  title: Event Planner API
  description: REST API for planning events and managing guests.
  version: 1.0.0

servers:
  - url: http://localhost:3000

tags:
  - name: Events
  - name: Guests

paths:
  /events:
    get:
      tags: [Events]
      summary: Get all events
      parameters:
        - name: location
          in: query
          required: false
          description: Only return events in this location
          schema:
            type: string
            example: Sligo
        - name: sort
          in: query
          required: false
          description: Sort events by date (earliest first)
          schema:
            type: string
            enum: [date]
      responses:
        "200":
          description: A list of events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Event"
    post:
      tags: [Events]
      summary: Create an event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventInput"
      responses:
        "201":
          description: Event created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "400":
          $ref: "#/components/responses/ValidationError"

  /events/{id}:
    parameters:
      - $ref: "#/components/parameters/EventId"
    get:
      tags: [Events]
      summary: Get one event
      responses:
        "200":
          description: The event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "400":
          $ref: "#/components/responses/InvalidId"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Events]
      summary: Update an event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventInput"
      responses:
        "200":
          description: Event updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "400":
          description: Invalid id or data
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Message"
                  - $ref: "#/components/schemas/ValidationErrors"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Events]
      summary: Delete an event and all its guests
      responses:
        "204":
          description: Event deleted
        "400":
          $ref: "#/components/responses/InvalidId"
        "404":
          $ref: "#/components/responses/NotFound"

  /events/{id}/guests:
    parameters:
      - $ref: "#/components/parameters/EventId"
    get:
      tags: [Guests]
      summary: Get all guests for an event
      parameters:
        - name: rsvp
          in: query
          required: false
          description: Only return guests with this RSVP status
          schema:
            type: string
            enum: [yes, no, pending]
      responses:
        "200":
          description: A list of guests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Guest"
        "400":
          $ref: "#/components/responses/InvalidId"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Guests]
      summary: Add a guest to an event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuestInput"
      responses:
        "201":
          description: Guest added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Guest"
        "400":
          description: Invalid id or data
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Message"
                  - $ref: "#/components/schemas/ValidationErrors"
        "404":
          $ref: "#/components/responses/NotFound"

  /guests/{id}:
    parameters:
      - $ref: "#/components/parameters/GuestId"
    get:
      tags: [Guests]
      summary: Get one guest
      responses:
        "200":
          description: The guest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Guest"
        "400":
          $ref: "#/components/responses/InvalidId"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Guests]
      summary: Update a guest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuestInput"
      responses:
        "200":
          description: Guest updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Guest"
        "400":
          description: Invalid id or data
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Message"
                  - $ref: "#/components/schemas/ValidationErrors"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Guests]
      summary: Delete a guest
      responses:
        "204":
          description: Guest deleted
        "400":
          $ref: "#/components/responses/InvalidId"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  parameters:
    EventId:
      name: id
      in: path
      required: true
      description: The event's MongoDB id
      schema:
        type: string
        example: 6ac8bedb7609cfd954c02069
    GuestId:
      name: id
      in: path
      required: true
      description: The guest's MongoDB id
      schema:
        type: string
        example: 6ac8bf107609cfd954c02071

  schemas:
    EventInput:
      type: object
      required: [title, date, location]
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 100
          example: Sarah's Wedding
        date:
          type: string
          format: date
          example: "2026-12-20"
        location:
          type: string
          minLength: 1
          example: Sligo
        description:
          type: string
          maxLength: 500
          example: Ceremony and reception

    Event:
      allOf:
        - $ref: "#/components/schemas/EventInput"
        - type: object
          properties:
            _id:
              type: string
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time

    GuestInput:
      type: object
      required: [name, email]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: John Murphy
        email:
          type: string
          format: email
          example: john@example.com
        rsvp:
          type: string
          enum: [yes, no, pending]
          default: pending

    Guest:
      allOf:
        - $ref: "#/components/schemas/GuestInput"
        - type: object
          properties:
            _id:
              type: string
            event:
              type: string
              description: The id of the event this guest belongs to
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time

    Message:
      type: object
      properties:
        message:
          type: string
          example: Event not found

    ValidationErrors:
      type: object
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              path:
                type: array
                items:
                  type: string
              message:
                type: string

  responses:
    NotFound:
      description: The resource was not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Message"
    InvalidId:
      description: The id is not a valid MongoDB id
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Message"
    ValidationError:
      description: The data failed validation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationErrors"